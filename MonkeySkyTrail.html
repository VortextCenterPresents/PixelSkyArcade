<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#68c9f3">
<title>PixelSky Arcade — Monkey Cloud Hop</title>
<style>
:root{color-scheme:light;--ink:#173c66;--blue:#1479c7;--gold:#ffcf55;--line:#b7e5f7}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:18px;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:linear-gradient(145deg,#8fe0ff,#eafaff 52%,#fff0c8);display:grid;place-items:center}.game{width:min(920px,100%);background:#ffffffdf;border:2px solid #fff;border-radius:22px;padding:clamp(12px,3vw,24px);box-shadow:0 12px 35px #17649b30}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.head h1{margin:0;font-size:clamp(22px,4vw,34px);color:#125d9f}.head p{margin:4px 0 12px}.hud{display:flex;gap:8px;flex-wrap:wrap}.pill{padding:7px 12px;border:1px solid #9ed5f0;background:#effaff;border-radius:999px;font-weight:800}.stage{position:relative;overflow:hidden;border:3px solid #fff;border-radius:18px;background:#77d1f6;box-shadow:inset 0 0 0 2px #8acdea}.stage canvas{display:block;width:100%;height:auto;aspect-ratio:900/440;touch-action:none}.overlay{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;background:#123e5b66;color:white}.overlay[hidden]{display:none}.overlay-card{max-width:440px;padding:20px;border:1px solid #ffffff99;border-radius:18px;background:#102e48cc;backdrop-filter:blur(8px)}.overlay h2{margin:0 0 8px;font-size:clamp(24px,5vw,38px)}button{border:0;border-radius:12px;padding:12px 17px;font:inherit;font-weight:900;color:#183b5b;background:linear-gradient(#ffe17c,#ffbd45);box-shadow:0 4px 0 #c87b24;cursor:pointer;touch-action:manipulation;user-select:none}button:active{transform:translateY(2px);box-shadow:0 2px 0 #c87b24}.controls{display:flex;justify-content:center;gap:12px;margin-top:12px}.controls button{min-width:100px;min-height:50px}.help{font-size:.92rem;color:#486b84;margin:12px 0 0;text-align:center}.back{background:#e8f6ff;box-shadow:0 4px 0 #8eb9d1}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:560px){body{padding:8px}.game{padding:12px;border-radius:16px}.controls button{flex:1;min-width:0}.help{font-size:.82rem}}
</style>
</head>
<body>
<main class="game">
 <header class="head"><div><h1>🐒 Monkey Cloud Hop</h1><p>Leap across the PixelSky and gather bananas and sky stars!</p></div><div class="hud" aria-live="polite"><span class="pill" id="score">🍌 Bananas: 0</span><span class="pill" id="best">🏆 Best: 0</span><span class="pill" id="lives">💛 3</span></div></header>
 <div class="stage"><canvas id="field" width="900" height="440" aria-label="Monkey Cloud Hop game field"></canvas><div class="overlay" id="overlay"><div class="overlay-card"><h2 id="overlayTitle">Ready to swing?</h2><p id="overlayText">Run, jump between clouds, collect bananas, and avoid storm clouds. Don't fall!</p><button id="start">▶ Start game</button></div></div></div>
 <div class="controls" aria-label="Touch controls"><button class="back" id="left" aria-label="Move left">◀ LEFT</button><button id="jump" aria-label="Jump">⬆ JUMP</button><button class="back" id="right" aria-label="Move right">RIGHT ▶</button></div>
 <p class="help">Keyboard: ←/A and →/D to move, Space/↑/W to jump. Touch controls work on phones and tablets.</p>
 <p class="help"><button class="back" id="home">← Restart / menu</button></p>
 <p class="sr" id="status" role="status" aria-live="polite"></p>
</main>
<script>
'use strict';
(()=>{
 const canvas=document.getElementById('field'),ctx=canvas.getContext('2d');
 const $=id=>document.getElementById(id), W=900,H=440;
 let running=false,raf=0,last=0,camera=0,score=0,lives=3,player,platforms,items,keys={left:false,right:false},jumpQueued=false,best=0;
 try{best=Number(localStorage.getItem('pixelsky_monkey_hop_best'))||0}catch(_){}
 $('best').textContent='🏆 Best: '+best;
 const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
 function makePlatform(x,y,w){return {x,y,w,h:18,cloud:Math.random()>.38}}
 function reset(){camera=0;score=0;lives=3;player={x:85,y:300,vx:0,vy:0,w:34,h:39,onGround:false,invuln:0};platforms=[makePlatform(0,365,210),makePlatform(270,315,130),makePlatform(455,275,145),makePlatform(665,320,140),makePlatform(850,270,150),makePlatform(1065,325,145),makePlatform(1270,275,155)];items=[];for(let x=205;x<1900;x+=135){items.push({x:x+Math.random()*45,y:170+Math.random()*125,type:Math.random()<.78?'banana':'star',got:false})}keys.left=keys.right=false;jumpQueued=false;updateHud()}
 function updateHud(){$('score').textContent='🍌 Bananas: '+score;$('lives').textContent='💛 '+lives}
 function drawCloud(x,y,w){ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(x+w*.5,y+5,w*.48,12,0,0,Math.PI*2);ctx.ellipse(x+w*.25,y,w*.2,13,0,0,Math.PI*2);ctx.ellipse(x+w*.52,y-5,w*.24,18,0,0,Math.PI*2);ctx.ellipse(x+w*.78,y+1,w*.19,12,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#a7e8ff';ctx.fillRect(x+8,y+7,w-16,5)}
 function drawMonkey(x,y){ctx.save();ctx.translate(x-camera,y);if(player.invuln>0&&Math.floor(performance.now()/90)%2)ctx.globalAlpha=.45;ctx.fillStyle='#8c542d';ctx.beginPath();ctx.ellipse(17,24,14,16,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(18,9,13,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f4c391';ctx.beginPath();ctx.ellipse(19,13,8,6,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(13,7,3,0,Math.PI*2);ctx.arc(23,7,3,0,Math.PI*2);ctx.fill();ctx.fillStyle='#19344a';ctx.beginPath();ctx.arc(14,7,1.3,0,Math.PI*2);ctx.arc(23,7,1.3,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#8c542d';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(6,23);ctx.quadraticCurveTo(-8,26,-4,14);ctx.stroke();ctx.fillStyle='#ffcf55';ctx.fillRect(7,33,8,5);ctx.fillRect(22,33,8,5);ctx.restore()}
 function draw(){const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#69c9f2');sky.addColorStop(1,'#d9f8ff');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);for(let i=0;i<8;i++){const x=((i*147-camera*.2)%1050+1050)%1050-70;drawCloud(x,65+(i%3)*55,125)}
   ctx.fillStyle='#9bdbb7';ctx.beginPath();ctx.moveTo(0,385);for(let x=0;x<=W;x+=60)ctx.lineTo(x,350+Math.sin((x+camera)*.012)*18);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();
   platforms.forEach(p=>{const x=p.x-camera;if(x<-200||x>W+100)return;if(p.cloud)drawCloud(x,p.y,p.w);else{ctx.fillStyle='#8a5a35';ctx.fillRect(x,p.y,p.w,p.h);ctx.fillStyle='#62bf63';ctx.fillRect(x,p.y,p.w,6)}});
   items.forEach(it=>{if(it.got)return;const x=it.x-camera;if(x<-30||x>W+30)return;ctx.save();ctx.translate(x,it.y);if(it.type==='banana'){ctx.font='27px sans-serif';ctx.fillText('🍌',-13,9)}else{ctx.shadowColor='#fff18a';ctx.shadowBlur=15;ctx.fillStyle='#fff06b';ctx.beginPath();for(let j=0;j<10;j++){const a=-Math.PI/2+j*Math.PI/5,r=j%2?7:15;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill()}ctx.restore()});
   // Storm puff hazard
   const hx=1390-camera;if(hx>-60&&hx<W+60){ctx.font='38px sans-serif';ctx.fillText('⛈️',hx,245)}drawMonkey(player.x,player.y);
 }
 function end(){running=false;if(raf)cancelAnimationFrame(raf);raf=0;keys.left=keys.right=false;const isBest=score>best;if(isBest){best=score;try{localStorage.setItem('pixelsky_monkey_hop_best',String(best))}catch(_){}}$('best').textContent='🏆 Best: '+best;$('overlayTitle').textContent=score?'Nice hopping!':'Clouds are tricky!';$('overlayText').textContent='You collected '+score+' sky treats. '+(isBest&&score?'New personal best! ':'')+'Tap below to try again.';$('start').textContent='↻ Play again';$('overlay').hidden=false;$('status').textContent='Game over. You collected '+score+' items.'}
 function tick(now){if(!running)return;const dt=Math.min(.035,(now-last)/1000||0);last=now;
   player.vx=((keys.right?1:0)-(keys.left?1:0))*235;player.x+=player.vx*dt;player.vy+=820*dt;const oldBottom=player.y+player.h;player.y+=player.vy*dt;player.onGround=false;
   if(jumpQueued&&player.onGround){player.vy=-390;player.onGround=false}jumpQueued=false;
   for(const p of platforms){if(player.vy>=0&&oldBottom<=p.y+5&&player.y+player.h>=p.y&&player.x+player.w>p.x&&player.x<p.x+p.w){player.y=p.y-player.h;player.vy=0;player.onGround=true}}
   camera=Math.max(0,player.x-260);if(player.x<camera+15)player.x=camera+15;
   for(const it of items){if(!it.got&&Math.hypot((player.x+player.w/2)-it.x,(player.y+player.h/2)-it.y)<30){it.got=true;score++;updateHud();$('status').textContent=it.type==='star'?'Sky star collected!':'Banana collected!'}}
   if(player.invuln>0)player.invuln-=dt;
   const hazard=1390;if(Math.abs(player.x+player.w/2-hazard)<35&&player.y>195&&player.y<285&&player.invuln<=0){lives--;player.invuln=1.3;player.vy=-220;updateHud();if(lives<=0){draw();end();return}}
   if(player.y>H+30){lives--;updateHud();if(lives<=0){draw();end();return}player.x=Math.max(55,camera+80);player.y=210;player.vy=-180;player.invuln=1.5}
   if(player.x>1700){$('overlayTitle').textContent='Sky trail complete!';$('overlayText').textContent='Amazing! You gathered '+score+' treats across the clouds.';draw();end();return}
   draw();raf=requestAnimationFrame(tick)
 }
 function start(){if(raf)cancelAnimationFrame(raf);reset();$('overlay').hidden=true;running=true;last=performance.now();$('status').textContent='Game started. Move and jump across the clouds.';draw();raf=requestAnimationFrame(tick)}
 $('start').addEventListener('click',start);$('home').addEventListener('click',()=>{if(running)end();else{$('overlayTitle').textContent='Ready to swing?';$('overlayText').textContent='Run, jump between clouds, collect bananas, and avoid storm clouds. Don\'t fall!';$('start').textContent='▶ Start game';$('overlay').hidden=false}});
 function bindHold(id,key){const b=$(id),on=e=>{e.preventDefault();keys[key]=true},off=e=>{if(e)e.preventDefault();keys[key]=false};b.addEventListener('pointerdown',on);['pointerup','pointercancel','pointerleave'].forEach(type=>b.addEventListener(type,off));b.addEventListener('contextmenu',e=>e.preventDefault())}
 bindHold('left','left');bindHold('right','right');$('jump').addEventListener('pointerdown',e=>{e.preventDefault();jumpQueued=true});
 window.addEventListener('keydown',e=>{if(!running)return;const k=e.key.toLowerCase();if(k==='arrowleft'||k==='a'){keys.left=true;e.preventDefault()}if(k==='arrowright'||k==='d'){keys.right=true;e.preventDefault()}if(k===' '||k==='arrowup'||k==='w'){jumpQueued=true;e.preventDefault()}});window.addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')keys.left=false;if(k==='arrowright'||k==='d')keys.right=false});window.addEventListener('blur',()=>{keys.left=keys.right=false});
 reset();draw();
})();
</script>
</body>
</html>
